<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📦 Track Your Order – Aravindh Chicken</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar">
    <div class="nav-container">
      <a class="logo" href="index.html">
        <i class="fas fa-drumstick-bite"></i>
        <span>Aravindh <em>Chicken</em></span>
      </a>
      <div class="nav-links">
        <a href="index.html" class="nav-link">
          <i class="fas fa-home"></i> <span>Home</span>
        </a>
      </div>
    </div>
  </nav>

  <!-- Track Section -->
  <section class="track-section">
    <div class="container">
      <div class="track-card">
        <div class="section-header" style="text-align:left;margin-bottom:0;">
          <div class="section-tag">Live Tracking</div>
          <h2 style="font-family:'Playfair Display',serif;font-size:clamp(24px,4vw,34px);color:var(--white);font-weight:800;margin-bottom:8px;">
            Track Your Order
          </h2>
          <p style="color:var(--text-muted);font-size:15px;margin:0;">Enter your phone number to see real-time status</p>
        </div>

        <form class="track-form" onsubmit="handleTrack(event)">
          <div class="input-group">
            <i class="fas fa-phone"></i>
            <input type="tel" id="trackPhone" placeholder="10-digit Phone Number" required>
          </div>
          <button type="submit" class="track-btn">
            <i class="fas fa-search"></i> Track Order
          </button>
        </form>

        <div id="trackResult" class="track-result"></div>
      </div>
    </div>
  </section>

  <!-- Loading -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <p>Tracking your order...</p>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Footer -->
  <footer class="footer">
    <p>🍗 <strong>Aravindh Chicken Shop</strong></p>
    <p>&copy; 2024 All rights reserved.</p>
  </footer>

  <script src="track.js"></script>
</body>
</html>
